<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AntiOS — Security Workspace</title>
<style>
:root{color-scheme:dark;font-family:Inter,Segoe UI,Arial,sans-serif;background:#080d18;color:#edf3ff}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:radial-gradient(ellipse at 70% 10%,#18334c,transparent 45%),linear-gradient(135deg,#080d18,#0b1424)}button{color:inherit;background:#1a2940;border:1px solid #344761;border-radius:9px;padding:10px 14px;cursor:pointer}button:hover{border-color:#65d7e8}button.primary{background:#146a79}button:disabled{opacity:.5}#desktop{height:calc(100vh - 48px);padding:24px;display:flex;flex-direction:column;gap:16px;flex-wrap:wrap;align-content:flex-start}.icon{width:92px;text-align:center;padding:12px 5px;border:1px solid transparent;border-radius:12px;cursor:pointer}.icon:hover{background:#ffffff12;border-color:#ffffff22}.glyph{display:block;font-size:30px;margin-bottom:8px}.icon small{font-size:12px}#taskbar{position:fixed;bottom:0;height:48px;left:0;right:0;background:#0a1220ed;border-top:1px solid #263650;display:flex;align-items:center;gap:10px;padding:0 14px}#brand{font-weight:800;letter-spacing:.12em;color:#65d7e8}#clock{margin-left:auto;color:#91a1ba;font-size:13px}#window{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(980px,calc(100vw - 28px));height:min(680px,calc(100vh - 84px));background:#0e1727;border:1px solid #344761;border-radius:16px;box-shadow:0 28px 90px #000a;display:none;overflow:hidden}#titlebar{height:52px;background:#16243a;display:flex;align-items:center;padding:0 16px;gap:12px;border-bottom:1px solid #263650}#windowTitle{font-weight:700}#close{margin-left:auto;background:#512c3a}#content{height:calc(100% - 52px);overflow:auto;padding:24px}h1{font-size:27px;margin:0 0 8px}h2{font-size:17px;margin:0 0 14px}p{color:#91a1ba;line-height:1.55}.muted{color:#91a1ba}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.tile{background:#111a2b;border:1px solid #263650;border-radius:13px;padding:18px}.stat{font-size:28px;font-weight:750;margin-top:8px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.status{display:inline-block;padding:6px 10px;border-radius:99px;background:#163b34;color:#67d6a2;font-size:12px}.notice{padding:13px 15px;border:1px solid #69572f;background:#332b1c;color:#f5d99c;border-radius:10px;font-size:13px;line-height:1.5;margin:14px 0}input[type=file]{max-width:100%;padding:12px;background:#101d30;border:1px dashed #4b6382;border-radius:10px;width:100%}#progress{height:8px;background:#25344b;border-radius:9px;overflow:hidden;margin:14px 0}#bar{height:100%;width:0;background:linear-gradient(90deg,#37a8ba,#6be0b0);transition:width .2s}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #263650;vertical-align:top}.table th{color:#91a1ba}.tag{font-size:11px;padding:4px 7px;border-radius:6px;background:#23334a}.tag.threat{color:#ff777e;background:#482733}.tag.clean{color:#67d6a2;background:#183b33}.testrow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #263650;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}#content{padding:15px}}
</style></head><body>
<main id="desktop"><div class="icon" data-app="home"><span class="glyph">◈</span><small>This PC</small></div><div class="icon" data-app="scanner"><span class="glyph">⌕</span><small>Anti Scanner</small></div><div class="icon" data-app="files"><span class="glyph">▤</span><small>File Inspector</small></div><div class="icon" data-app="tests"><span class="glyph">✓</span><small>Test Lab</small></div><div class="icon" data-app="about"><span class="glyph">ⓘ</span><small>About AntiOS</small></div></main>
<section id="window" role="dialog" aria-modal="true"><header id="titlebar"><span id="windowTitle">AntiOS</span><span class="muted">SECURITY WORKSPACE</span><button id="close">×</button></header><div id="content"></div></section>
<footer id="taskbar"><span id="brand">ANTI OS</span><button data-open="home">Dashboard</button><button data-open="scanner">Scanner</button><button data-open="tests">Test Lab</button><span id="clock"></span></footer>
<script>
"use strict";
const $=s=>document.querySelector(s),win=$("#window"),content=$("#content");let lastResults=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function openApp(a){$("#windowTitle").textContent=({home:"This PC",scanner:"Anti Scanner",files:"File Inspector",tests:"Anti Test Lab",about:"About AntiOS"})[a]||"AntiOS";win.style.display="block";({home:homeView,scanner:scannerView,files:filesView,tests:testsView,about:aboutView}[a]||homeView)()}
function homeView(){content.innerHTML='<h1>Welcome to AntiOS</h1><p>A browser-based security workspace for the Anti scanner project.</p><div class="actions"><span class="status">Browser sandbox active</span></div><div class="grid"><div class="tile"><div class="muted">Files checked this session</div><div class="stat">'+lastResults.length+'</div></div><div class="tile"><div class="muted">Threat indicators</div><div class="stat">'+lastResults.filter(x=>x.status==="threat").length+'</div></div><div class="tile"><div class="muted">Protection mode</div><div class="stat" style="font-size:19px">On-demand</div></div></div><div class="notice">AntiOS is a browser app, not a bootable operating system. The browser cannot inspect the whole disk, running processes, memory, startup entries, or block malware. Keep your system antivirus enabled.</div><h2>Quick actions</h2><div class="actions"><button class="primary" onclick="openApp(\'scanner\')">Scan selected files</button><button onclick="openApp(\'tests\')">Run safe self-tests</button><button onclick="openApp(\'files\')">Inspect a file</button></div>'}
function scannerView(){content.innerHTML='<h1>Anti Scanner</h1><p>Select files to inspect locally in this browser tab. Files are not uploaded.</p><div class="tile"><h2>Choose files</h2><input id="pick" type="file" multiple><div class="actions"><button class="primary" id="scanBtn">Start scan</button><button id="demoBtn">Create safe demo file</button></div><div id="scanStatus" class="muted">Waiting for files.</div><div id="progress"><div id="bar"></div></div></div><div id="results"></div><div class="notice">This scans only files you explicitly select. It does not replace the Python engine or Defender.</div>';$("#scanBtn").onclick=scanPicked;$("#demoBtn").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["Harmless AntiOS demo file"],{type:"text/plain"}));a.download="anti-demo.txt";a.click();URL.revokeObjectURL(a.href)}}
function filesView(){content.innerHTML='<h1>File Inspector</h1><p>Inspect file metadata and configured indicators without executing it.</p><input id="inspectPick" type="file"><div class="actions"><button class="primary" id="inspectBtn">Inspect file</button></div><div id="inspectResult"></div>';$("#inspectBtn").onclick=async()=>{const f=$("#inspectPick").files[0];if(!f){$("#inspectResult").textContent="Choose a file first.";return}$("#inspectResult").innerHTML=resultTable([await inspect(f)])}}
function testsView(){content.innerHTML='<h1>Anti Test Lab</h1><p>Harmless in-memory test cases. No malware is downloaded or executed.</p><div class="tile"><div id="testList">Tests have not been run.</div><div class="actions"><button class="primary" id="runTests">Run all tests</button></div><div id="testSummary" class="muted"></div></div><div class="notice">EICAR is a harmless standard antivirus test pattern used only as in-memory test data.</div>';$("#runTests").onclick=runTests}
function aboutView(){content.innerHTML='<h1>About AntiOS</h1><div class="tile"><h2>Capabilities</h2><p>Selected-file inspection, EICAR test detection, executable/document header mismatch checks, and SHA-256 hashing when Web Crypto is available.</p><h2>Limitations</h2><p>Cannot boot a computer, access the whole filesystem, monitor processes, scan RAM, intercept writes, enforce quarantine, or provide real-time protection.</p><p><a href="https://github.com/babusundar0501-eng/Anti" target="_blank" rel="noopener">Anti on GitHub</a></p></div>'}
function resultTable(rows){return '<div class="tile" style="margin-top:16px"><h2>Scan results</h2><table class="table"><thead><tr><th>File</th><th>Verdict</th><th>Details</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.name)+'</td><td><span class="tag '+r.status+'">'+r.status.toUpperCase()+'</span></td><td>'+r.reasons.map(esc).join("<br>")+'<br><span class="muted">'+(r.sha256?"SHA-256 "+r.sha256:"Hash unavailable")+'</span></td></tr>').join("")+'</tbody></table></div>'}
async function inspect(file){const r={name:file.name,status:"clean",reasons:[],sha256:null};try{const buf=await file.arrayBuffer(),b=new Uint8Array(buf),txt=new TextDecoder("latin1").decode(b);if(txt.includes("X5O!P%@AP[4\\PZX54(P^)7CC)7}$EICAR")){r.status="threat";r.reasons.push("EICAR antivirus test signature detected")}const ext=(file.name.split(".").pop()||"").toLowerCase(),pe=b[0]===0x4d&&b[1]===0x5a,elf=b[0]===0x7f&&b[1]===0x45&&b[2]===0x4c&&b[3]===0x46,docs=["pdf","jpg","jpeg","png","gif","txt","doc","docx","xls","xlsx","ppt","pptx","mp3","mp4"];if((pe||elf)&&docs.includes(ext)){r.status="threat";r.reasons.push("Executable header disguised with document/media extension")}if(r.status==="clean")r.reasons.push("No configured browser indicators found (not proof of safety)");if(globalThis.crypto&&crypto.subtle){const h=await crypto.subtle.digest("SHA-256",buf);r.sha256=Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,"0")).join("")}}catch(e){r.status="error";r.reasons.push("Could not inspect file: "+e.message)}return r}
async function scanPicked(){const fs=Array.from($("#pick").files);if(!fs.length){$("#scanStatus").textContent="Choose at least one file.";return}const btn=$("#scanBtn");btn.disabled=true;lastResults=[];for(let i=0;i<fs.length;i++){lastResults.push(await inspect(fs[i]));$("#bar").style.width=((i+1)/fs.length*100)+"%";$("#scanStatus").textContent="Inspected "+(i+1)+" of "+fs.length+" files"}$("#results").innerHTML=resultTable(lastResults);$("#scanStatus").textContent="Finished: "+lastResults.filter(x=>x.status==="threat").length+" threat indicator(s).";btn.disabled=false}
async function runTests(){const cases=[["EICAR test string detected",async()=>{const f=new File(["X5O!P%@AP[4\\PZX54(P^)7CC)7}$EICAR"],"eicar-test.txt");return (await inspect(f)).status==="threat"}],["Benign text not flagged",async()=>{const f=new File(["hello AntiOS"],"notes.txt");return (await inspect(f)).status==="clean"}],["Executable header disguised as PDF detected",async()=>{const f=new File([new Uint8Array([0x4d,0x5a,0,0])],"sample.pdf");return (await inspect(f)).status==="threat"}],["SHA-256 generated where supported",async()=>{const r=await inspect(new File(["hash me"],"hash.txt"));return !crypto.subtle||/^[a-f0-9]{64}$/.test(r.sha256||"")}]];let pass=0,out="";for(const t of cases){let ok=false;try{ok=await t[1]()}catch(e){}if(ok)pass++;out+='<div class="testrow"><span>'+esc(t[0])+'</span><span class="tag '+(ok?"clean":"threat")+'">'+(ok?"PASS":"FAIL")+'</span></div>'}$("#testList").innerHTML=out;$("#testSummary").textContent=pass+"/"+cases.length+" tests passed. These test only this browser demo's checks."}
document.querySelectorAll("[data-app]").forEach(e=>e.addEventListener("dblclick",()=>openApp(e.dataset.app)));document.querySelectorAll("[data-open]").forEach(e=>e.addEventListener("click",()=>openApp(e.dataset.open)));$("#close").onclick=()=>win.style.display="none";$("#clock").textContent=new Date().toLocaleString();openApp("home");
</script></body></html>
